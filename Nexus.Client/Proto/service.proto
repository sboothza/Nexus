syntax = "proto3";

option csharp_namespace = "GrpcCaller";

package caller;

service Caller {
  rpc Query (QueryRequest) returns (QueryResponse);
}

message QueryRequest {
  string bindingName = 1;
  map<string, string> extraInfo = 2;
  string data = 3;
}

message QueryResponse {
  bool success = 1;
  map<string, string> extraInfo = 2;
  string data = 3;
}

message Empty {
}